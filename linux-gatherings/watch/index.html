<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmed x86 | Linux Gatherings Player</title>
    <link rel="icon" href="https://github.com/ahmed-x86.png" type="image/png">
    <meta name="page-config" content='{"pageType":"project","navLinks":[{"href":"/linux-gatherings","text":"Linux Gatherings","i18nKey":"btn-view-gatherings"},{"href":"https://github.com/ahmed-x86","text":"GitHub Repo","i18nKey":"nav-github-repo","target":"_blank"}]}'>
    <link rel="stylesheet" href="/style.css">
    <style>
        .page-layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 30px; max-width: 1700px; margin: 20px auto; padding: 0 3%; align-items: start; }
        @media (max-width: 1000px) { .page-layout { grid-template-columns: 1fr; } }
        .main-content { width: 100%; }
        .video-wrapper { margin: 0 0 20px 0; width: 100%; }
        video { width: 100%; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); border: 2px solid var(--surface0); display: block; background-color: #000; }
        .video-main-title { color: var(--mauve); font-size: 1.8rem; margin: 10px 0; font-weight: bold; }
        .channel-strip { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
        .channel-strip img { width: 45px; height: 45px; border-radius: 50%; border: 1px solid var(--surface1); }
        .tabs-container { margin-top: 20px; }
        .tabs-header { display: flex; gap: 10px; border-bottom: 2px solid var(--surface0); margin-bottom: 20px; }
        .tab-btn { background: none; border: none; color: var(--subtext); padding: 10px 20px; cursor: pointer; font-weight: bold; transition: 0.3s; font-family: inherit; }
        .tab-btn.active { color: var(--mauve); border-bottom: 2px solid var(--mauve); margin-bottom: -2px; }
        .tab-content { display: none; background-color: var(--surface0); padding: 25px; border-left: 4px solid var(--mauve); border-radius: 4px; line-height: 1.8; }
        .tab-content.active { display: block; }
        .tab-content a { color: var(--blue); text-decoration: none; }
        .tab-content a:hover { text-decoration: underline; }
        .hashtags { color: var(--blue); font-weight: bold; }
        .playlist-sidebar { background-color: var(--surface0); border-radius: 12px; padding: 20px; border: 1px solid var(--surface1); position: sticky; top: 80px; }
        .playlist-title { color: var(--text); margin-top: 0; margin-bottom: 20px; font-size: 1.2rem; border-bottom: 2px solid var(--surface1); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .playlist-count { font-size: 0.8rem; background-color: var(--surface1); padding: 2px 8px; border-radius: 10px; }
        .playlist-item { display: flex; align-items: flex-start; gap: 12px; text-decoration: none; color: var(--text); transition: 0.3s ease; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
        .playlist-item:hover { background-color: var(--surface1); }
        .playlist-item.active-video { border-left: 4px solid var(--mauve); background-color: var(--surface1); }
        .playlist-item img { width: 120px; height: 67.5px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
        .playlist-info { display: flex; flex-direction: column; justify-content: center; }
        .playlist-info h4 { margin: 0 0 5px 0; font-size: 0.95rem; line-height: 1.4; color: var(--text); }
        .playlist-info span { font-size: 0.8rem; color: var(--subtext); }
    </style>
</head>
<body>
    <div id="page-content" class="page-layout">
        <div class="main-content">
            <div id="badges-container" class="badges" style="margin-bottom: 15px; justify-content: flex-start;"></div>
            <div id="video-wrapper" class="video-wrapper"></div>
            <h2 id="video-main-title" class="video-main-title">Loading...</h2>
            
            <div id="channel-strip" class="channel-strip"></div>
            
            <div class="tabs-container">
                <div class="tabs-header">
                    <button class="tab-btn active" data-tab="desc">Description</button>
                    <button class="tab-btn" data-tab="links">Links</button>
                    <button class="tab-btn" data-tab="tags">Tags</button>
                </div>
                <div id="tab-desc" class="tab-content active" dir="auto"></div>
                <div id="tab-links" class="tab-content" dir="auto"></div>
                <div id="tab-tags" class="tab-content" dir="auto"></div>
            </div>

            <div style="text-align: left; margin-top: 30px;">
                <a id="download-btn-site" href="#" class="btn btn--primary" data-i18n="download-btn">📥 Download Video Lesson</a>
            </div>
        </div>

        <aside class="playlist-sidebar">
            <h3 class="playlist-title">
                <span data-i18n="sidebar-title">Linux Gatherings 🐧</span>
                <span id="playlist-count" class="playlist-count"></span>
            </h3>
            <div id="playlist-container"></div>
        </aside>
    </div>
    
    <script src="/js/lang.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/theme.js"></script>
    <script src="./app.js"></script>
</body>
</html>
